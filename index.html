      (() => {
        try {
          const stored = localStorage.getItem("observatorio-theme");
          const theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.classList.toggle("light", theme === "light");
          document.documentElement.style.colorScheme = theme;
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.content = theme === "light" ? "#f5f7fa" : "#0b1117";
        } catch {}
      })();

    <noscript>
      <main style="max-width:720px;margin:40px auto;padding:24px;font-family:system-ui,sans-serif">
        <h1>Observatório Eleitoral — Águas Lindas de Goiás 2026</h1>
        <p>Este observatório precisa de JavaScript para exibir os painéis interativos.</p>
      </main>
    </noscript>
    <script>
      (() => {
        const startedAt = Date.now();
        window.setTimeout(() => {
          const root = document.getElementById('root');
          const mounted = document.documentElement.dataset.observatorioMounted === 'true';
          if (!root || mounted) return;
          const fallback = document.getElementById('boot-fallback');
          if (fallback) {
            fallback.innerHTML = '<strong style="font-size:18px">A interface não iniciou</strong><p style="margin:10px 0 0;color:#8b949e;line-height:1.6">O navegador não conseguiu executar o aplicativo em 10 segundos. Recarregue a página. Se o problema persistir, abra o console do navegador e informe o erro.</p><button type="button" onclick="location.reload()" style="margin-top:16px;padding:10px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer">Recarregar</button>';
            fallback.setAttribute('role', 'alert');
            fallback.dataset.bootTimeout = String(Date.now() - startedAt);
          }
        }, 10000);
      })();
    </script>
