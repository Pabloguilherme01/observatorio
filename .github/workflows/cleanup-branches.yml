name: Cleanup stale merged branches

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar sem excluir branches'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-branches
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Cleanup stale branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLEANUP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          CLEANUP_MAX_AGE_DAYS: '7'
          CLEANUP_KEEP_PER_PREFIX: '2'
          CLEANUP_MERGED_BRANCHES: 'true'
          CLEANUP_MERGED_MAX_AGE_DAYS: '7'
          CLEANUP_MAX_DELETIONS: '50'
        run: npm run cleanup:branches