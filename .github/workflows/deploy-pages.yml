name: Deploy to GitHub Pages
# Publication starts from CI completion; the build gate below still requires Browser compatibility and CodeQL for the exact main SHA.
# Manual dispatch uses the same complete release-gate check.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v3
  cancel-in-progress: true

env:
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  OBSERVATORIO_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      ${{
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact CI-validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Require all release gates for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(ci.yml browser.yml codeql.yml)
          for attempt in $(seq 1 30); do
            ready=true
            for workflow in "${workflows[@]}"; do
              latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${DEPLOY_SHA}&event=push&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0] | [.status, .conclusion] | @tsv')"
              status="$(printf '%s\n' "$latest" | cut -f1)"
              conclusion="$(printf '%s\n' "$latest" | cut -f2)"
              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "PASS $workflow $DEPLOY_SHA"
              elif [[ "$status" == "completed" ]]; then
                echo "FAIL $workflow status=$status conclusion=$conclusion for $DEPLOY_SHA"
                exit 1
              else
                echo "WAIT $workflow status=${status:-not-found} conclusion=${conclusion:-pending} attempt=$attempt/30"
                ready=false
              fi
            done
            if [[ "$ready" == true ]]; then
              browser_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/browser.yml/runs?head_sha=${DEPLOY_SHA}&event=push&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id')"
              test -n "$browser_run_id"
              echo "BROWSER_RUN_ID=$browser_run_id" >> "$GITHUB_ENV"
              echo "All release gates passed for $DEPLOY_SHA. Browser artifact run: $browser_run_id"
              exit 0
            fi
            sleep 20
          done
          echo "FAIL release gates did not converge for $DEPLOY_SHA."
          exit 1

      - name: Ensure main still points to validated SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "${DEPLOY_SHA}"
          echo "Main head still matches validated SHA ${DEPLOY_SHA}."
      - name: Audit workflow structure
        run: npm run audit:workflows

      - name: Dependency vulnerability gate
        run: npm run audit:deps

      - name: Release readiness contract
        env:
          RELEASE_EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
        run: npm run audit:release

      - name: Download exact Browser production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          gh run download "$BROWSER_RUN_ID" --name observatorio-browser-dist --dir dist
          test -f dist/index.html
          test -d dist/assets
          echo "Reused Browser artifact from run $BROWSER_RUN_ID for SHA ${DEPLOY_SHA}."

      - name: Audit production bundle budget
        run: npm run audit:bundle

      - name: Verify production PWA artifact
        run: npm run test:pwa

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Verify published site and public API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            page="$(curl -fsSL --max-time 20 https://pabloguilherme01.github.io/observatorio/ || true)"
            if printf '%s' "$page" | grep -Fq "Observatório Público — Águas Lindas de Goiás"; then break; fi
            sleep 3
          done
          printf '%s' "$page" | grep -F "Observatório Público — Águas Lindas de Goiás"
          health="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/api/v2/health.json)"
          printf '%s' "$health" | grep -E '"status": "(ok|degraded)"'
          printf '%s' "$health" | grep -F '"publication"'
          printf '%s' "$health" | grep -F '"integrity"'
          printf '%s' "$health" | grep -F '"contract": "municipal-publication-v2"'
          public_commit="$(printf '%s' "$health" | grep -oE '"commitSha": "[^"]+"' | head -n 1 | cut -d'"' -f4)"
          test "$public_commit" = "${DEPLOY_SHA}"
          if printf '%s' "$health" | grep -Fq '"status": "degraded"'; then
            echo "Municipal dataset integrity is degraded; inspect the health diagnostics."
            exit 1
          fi
          openapi="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/api/v2/openapi.json)"
          printf '%s' "$openapi" | grep -F '"openapi": "3.0.3"'

      - name: Verify SPA deep-link fallback asset
        shell: bash
        run: |
          set -euo pipefail
          fallback_file="$(mktemp)"
          status="$(curl -sS --retry 3 --max-time 20 -o "$fallback_file" -w '%{http_code}' https://pabloguilherme01.github.io/observatorio/rota-virtual-de-validacao/)"
          test "$status" = "404"
          fallback="$(cat "$fallback_file")"
          printf '%s' "$fallback" | grep -F 'obsSpaFallback'
          printf '%s' "$fallback" | grep -F 'encodeURIComponent'

      - name: Verify critical published app markers
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/)"
          printf '%s' "$page" | grep -F 'Observatório Público — Águas Lindas de Goiás'
          printf '%s' "$page" | grep -F 'id="root"'
          manifest="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/manifest.webmanifest)"
          printf '%s' "$manifest" | grep -F 'Observatório Águas Lindas 2026'
          printf '%s' "$manifest" | grep -F 'pwa-192.png'
          printf '%s' "$manifest" | grep -F 'pwa-512.png'
          for icon in pwa-192.png pwa-512.png apple-touch-icon.png; do
            bytes="$(curl -fsSL --retry 3 --max-time 20 "https://pabloguilherme01.github.io/observatorio/$icon" | wc -c)"
            test "$bytes" -gt 1000
          done

          sw="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/sw.js)"
          printf '%s' "$sw" | grep -F 'observatorio-static-v'
          for asset in pwa-192.png pwa-512.png apple-touch-icon.png offline.html; do
            count="$(printf '%s' "$sw" | grep -o "url:\"$asset\"" | wc -l)"
            test "$count" = "1"
          done

          asset_js="$(printf '%s' "$page" | grep -oE 'src="[^"]+\.js"' | head -n 1 | cut -d'"' -f2)"
          asset_css="$(printf '%s' "$page" | grep -oE 'href="[^"]+\.css"' | head -n 1 | cut -d'"' -f2)"
          test -n "$asset_js"
          test -n "$asset_css"
          case "$asset_js" in
            http*) js_url="$asset_js" ;;
            /*) js_url="https://pabloguilherme01.github.io$asset_js" ;;
            *) js_url="https://pabloguilherme01.github.io/observatorio/$asset_js" ;;
          esac
          case "$asset_css" in
            http*) css_url="$asset_css" ;;
            /*) css_url="https://pabloguilherme01.github.io$asset_css" ;;
            *) css_url="https://pabloguilherme01.github.io/observatorio/$asset_css" ;;
          esac
          js_bytes="$(curl -fsSL --retry 3 --max-time 20 "$js_url" | wc -c)"
          css_bytes="$(curl -fsSL --retry 3 --max-time 20 "$css_url" | wc -c)"
          test "$js_bytes" -gt 1000
          test "$css_bytes" -gt 1000
          printf 'Published JS bytes: %s\n' "$js_bytes"
          printf 'Published CSS bytes: %s\n' "$css_bytes"
