name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate static consistency
        run: npm run audit:static
      - name: Validate accessibility and contrast
        run: npm run audit:a11y
      - name: Validate mobile UX
        run: npm run audit:mobile
      - name: Validate data contracts
        run: npm run validate:observatorio
      - name: Validate TSE snapshot — production gate
        env:
          REQUIRE_TSE_SYNC: 'true'
        run: npm run validate:tse
      - name: Validate results feed
        run: npm run validate:results
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
