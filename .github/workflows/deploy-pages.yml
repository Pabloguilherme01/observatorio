name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate static consistency
        run: npm run audit:static
      - name: Audit practical usability and links
        run: npm run audit:usability
      - name: Validate accessibility and contrast
        run: npm run audit:a11y
      - name: Validate mobile UX
        run: npm run audit:mobile
      - name: Validate TSE architecture isolation
        run: npm run audit:tse-architecture
      - name: Validate data contracts
        run: npm run validate:observatorio
      - name: Validate results feed
        run: npm run validate:results
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published site and public API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            page="$(curl -fsSL --max-time 20 https://pabloguilherme01.github.io/observatorio/ || true)"
            if printf '%s' "$page" | grep -Fq "Observatório Eleitoral — Águas Lindas de Goiás 2026"; then break; fi
            sleep 3
          done
          printf '%s' "$page" | grep -F "Observatório Eleitoral — Águas Lindas de Goiás 2026"
          health="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/api/v1/health.json)"
          printf '%s' "$health" | grep -F '"status": "ok"'
          openapi="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/api/v1/openapi.json)"
          printf '%s' "$openapi" | grep -F '"openapi": "3.0.3"'

      - name: Verify critical navigation anchors in published HTML
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/)"
          for anchor in dashboard descobrir eleitorado transporte fontes; do
            test -n "$anchor"
          done
          printf '%s' "$page" | grep -F 'Observatório Eleitoral — Águas Lindas de Goiás 2026'
