name: Deploy to GitHub Pages
# Pipeline: quality, build, deploy and published-site verification.

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2
  cancel-in-progress: true

# A publicação é disparada exclusivamente por push/manual para evitar loops.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete quality gate
        env:
          AUDIT_PUBLIC_SERVICES_LIVE: 'true'
        run: npm run audit:all
      - name: Validate TSE candidate snapshot contract
        env:
          REQUIRE_TSE_SYNC: 'false'
          REQUIRE_TSE_FRESH: 'false'
          TSE_MAX_AGE_HOURS: '24'
        run: npm run validate:tse
      - name: Validate candidate source guard
        run: node scripts/test-candidate-source-guard.mjs

      - name: Verify TSE architecture
        run: npm run audit:tse-architecture
      - name: Validate production results feed contract
        run: npm run validate:results
      - name: Verify JWS implementation
        run: npm run test:jws
      - name: Build production artifact
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  verify:
    needs: deploy
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Verify published site and public API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            page="$(curl -fsSL --max-time 20 https://pabloguilherme01.github.io/observatorio/ || true)"
            if printf '%s' "$page" | grep -Fq "Observatório Eleitoral — Águas Lindas de Goiás 2026"; then break; fi
            sleep 3
          done
          printf '%s' "$page" | grep -F "Observatório Eleitoral — Águas Lindas de Goiás 2026"
          health="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/api/v1/health.json)"
          printf '%s' "$health" | grep -E '"status": "(ok|degraded)"'
          printf '%s' "$health" | grep -F '"tseCandidates"'
          printf '%s' "$health" | grep -F '"maxAgeHours": 24'
          if printf '%s' "$health" | grep -Fq '"status": "degraded"'; then
            echo "TSE upstream stale/unavailable; published site is intentionally degraded, previous validated snapshot preserved."
          fi
          openapi="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/api/v1/openapi.json)"
          printf '%s' "$openapi" | grep -F '"openapi": "3.0.3"'

      - name: Verify critical published app markers
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/)"
          printf '%s' "$page" | grep -F 'Observatório Eleitoral — Águas Lindas de Goiás 2026'
          printf '%s' "$page" | grep -F 'id="root"'
          manifest="$(curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/manifest.webmanifest)"
          printf '%s' "$manifest" | grep -F 'Observatório Águas Lindas 2026'
          curl -fsSL --retry 3 --max-time 20 https://pabloguilherme01.github.io/observatorio/sw.js | grep -F 'observatorio-static-v'

          asset_js="$(printf '%s' "$page" | grep -oE 'src="[^"]+\.js"' | head -n 1 | cut -d'"' -f2)"
          asset_css="$(printf '%s' "$page" | grep -oE 'href="[^"]+\.css"' | head -n 1 | cut -d'"' -f2)"
          test -n "$asset_js"
          test -n "$asset_css"
          case "$asset_js" in
            http*) js_url="$asset_js" ;;
            /*) js_url="https://pabloguilherme01.github.io$asset_js" ;;
            *) js_url="https://pabloguilherme01.github.io/observatorio/$asset_js" ;;
          esac
          case "$asset_css" in
            http*) css_url="$asset_css" ;;
            /*) css_url="https://pabloguilherme01.github.io$asset_css" ;;
            *) css_url="https://pabloguilherme01.github.io/observatorio/$asset_css" ;;
          esac
          js_bytes="$(curl -fsSL --retry 3 --max-time 20 "$js_url" | wc -c)"
          css_bytes="$(curl -fsSL --retry 3 --max-time 20 "$css_url" | wc -c)"
          test "$js_bytes" -gt 1000
          test "$css_bytes" -gt 1000
          printf 'Published JS bytes: %s\n' "$js_bytes"
          printf 'Published CSS bytes: %s\n' "$css_bytes"
