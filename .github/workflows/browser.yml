name: Browser compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser · ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.non_blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chrome-desktop
            engine: chromium
            timeout: 30
            non_blocking: false
          - project: firefox-desktop
            engine: firefox
            timeout: 30
            non_blocking: false
          - project: safari-desktop
            engine: webkit
            timeout: 15
            non_blocking: true
          - project: chrome-android
            engine: chromium
            timeout: 30
            non_blocking: false
          - project: safari-iphone
            engine: webkit
            timeout: 30
            non_blocking: false
          - project: safari-iphone-se
            engine: webkit
            timeout: 30
            non_blocking: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser engine
        run: npm exec -- playwright install --with-deps "${{ matrix.engine }}"

      - name: Cross-browser audit
        run: npm exec -- playwright test --config=playwright.config.mjs --project="${{ matrix.project }}"
