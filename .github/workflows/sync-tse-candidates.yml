name: Sync TSE candidates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tse-candidates
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync official TSE candidate snapshot directly
        run: npm run sync:tse

      - name: Validate directly captured TSE snapshot
        env:
          REQUIRE_TSE_SYNC: 'true'
        run: npm run validate:tse

      - name: Sync municipal candidates, Instagram and photos
        run: npx tsx scripts/tse/ingest-candidates-local.ts

      - name: Typecheck and production build
        run: |
          npm run typecheck
          npm run build

      - name: Commit snapshot, API and media when changed
        shell: bash
        run: |
          if git diff --quiet -- src/data/generated/tse2026-candidates.json public/api/v1/candidatos.json public/img/candidatos; then
            echo "No municipal candidate change."
            exit 0
          fi

          git config user.name "observatorio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/tse2026-candidates.json public/api/v1/candidatos.json public/img/candidatos
          git commit -m "data: sync municipal TSE candidates and social profiles"
          git push
