name: Sync TSE candidates

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 03 * * *'

permissions:
  contents: write

concurrency:
  group: sync-tse-candidates
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'data: sync TSE 2026 candidate snapshot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync official TSE candidate snapshot
        run: npm run sync:tse

      - name: Validate synchronized contract
        env:
          REQUIRE_TSE_SYNC: 'true'
        run: npm run validate:tse

      - name: Commit snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- src/data/generated/tse2026-candidates.json src/data/generated/tse2026-diff.json src/data/generated/history; then
            echo "No candidate snapshot change."
            exit 0
          fi

          git config user.name "observatorio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/tse2026-candidates.json src/data/generated/tse2026-diff.json src/data/generated/history
          git commit -m "data: sync TSE 2026 candidate snapshot"
          git push
