name: Reparo de CSS v3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reparar e validar
        run: |
          node <<'EOF'
          const fs = require("fs");
          const p = "src/assets/styles/globals.css";
          let s = fs.readFileSync(p, "utf8");
          const fixes = [
            [/--surface-st\s+rong/g, "--surface-strong"],
            [/ov\s+erflow\b/g, "overflow"],
            [/--obs-fon\s+t-sans/g, "--obs-font-sans"],
            [/\bmin-widt\s+h\b/g, "min-width"],
            [/\bdis\s+play\b/g, "display"],
          ];
          const counts = [];
          for (const [re, b] of fixes) { const m = s.match(re); counts.push(`${re} -> ${b} (${m ? m.length : 0}x)`); s = s.replace(re, b); }
          fs.writeFileSync(p, s);
          fs.writeFileSync("repair-report.txt", counts.join("\n"));
          console.log(fs.readFileSync("repair-report.txt", "utf8"));
          EOF
          npm install --no-audit --no-fund > /dev/null 2>&1
          set +e
          npm run build > build-output.log 2>&1
          echo "exit_code=$?" >> build-output.log
      - name: Commit do reparo e limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/styles/globals.css
          if git diff --cached --quiet; then
            echo "nada a reparar"
          else
            git rm -f .github/workflows/repair-css-v3.yml
            git commit -m "fix: reparar quebras de linha dentro de identificadores do globals.css"
            git push
          fi
          git rm -f .github/workflows/repair-css-v3.yml 2>/dev/null || true
      - name: Garantir remocao do workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/repair-css-v3.yml 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: remover workflow temporario de reparo" && git push) || echo "ja limpo"
      - name: Relatorio em issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync("repair-report.txt") ? fs.readFileSync("repair-report.txt", "utf8") : "sem relatorio";
            const log = fs.existsSync("build-output.log") ? fs.readFileSync("build-output.log", "utf8") : "sem log";
            const warns = (log.match(/Issue #\d+/g) || []).length;
            const exitLine = (log.match(/exit_code=\d+/) || [""])[0];
            const body = "RELATORIO DE REPARO V3\n\n~~~\n" + report + "\n~~~\n\nWarnings CSS no build: " + warns + "\n" + exitLine + "\n\nLOG (fim):\n\n~~~\n" + log.slice(-800) + "\n~~~";
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: "Reparo do globals.css v3: relatorio", body });
