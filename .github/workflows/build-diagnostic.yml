name: Diagnostico de build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  build-diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capturar tudo
        run: |
          set +e
          { npm install --no-audit --no-fund && npm run build; } > build-output.log 2>&1
          echo "exit_code=$?" >> build-output.log
      - name: Reportar em issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const log = fs.existsSync("build-output.log")
              ? fs.readFileSync("build-output.log", "utf8")
              : "log nao encontrado";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Diagnostico de build v3: saida completa",
              body: "Ultimos 10000 caracteres:\n\n~~~\n" + log.slice(-10000) + "\n~~~"
            });
