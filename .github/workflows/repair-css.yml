name: Reparo de CSS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reparar e validar
        run: |
          node <<'EOF'
          const fs = require("fs");
          const p = "src/assets/styles/globals.css";
          let s = fs.readFileSync(p, "utf8");
          const fixes = [
            ["--surface-st rong", "--surface-strong"],
            ["ov erflow", "overflow"],
            ["--obs-fon t-sans", "--obs-font-sans"],
            ["min-widt h", "min-width"],
            ["dis play", "display"],
          ];
          const counts = [];
          for (const [a, b] of fixes) { const n = s.split(a).length - 1; s = s.split(a).join(b); counts.push(`${a} -> ${b} (${n}x)`); }
          let selN = 0;
          s = s.replace(/#\s+([a-zA-Z0-9_-])/g, (m, c) => { selN++; return "#" + c; });
          counts.push(`#${"<espaço>"} -> # (${selN}x)`);
          fs.writeFileSync(p, s);
          const lines = s.split("\n");
          const sus = lines.map((l, i) => [i + 1, l]).filter(([i, l]) => /[a-z] [a-z]{1,4}:/.test(l));
          fs.writeFileSync("repair-report.txt", counts.join("\n") + "\n\nLINHAS SUSPEITAS RESTANTES:\n" + sus.map(([i, l]) => i + ": " + l.trim()).join("\n"));
          console.log(fs.readFileSync("repair-report.txt", "utf8"));
          EOF
          npm install --no-audit --no-fund > /dev/null 2>&1
          set +e
          npm run build > build-output.log 2>&1
          echo "exit_code=$?" >> build-output.log
        
      - name: Commit do reparo e limpeza de workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/styles/globals.css
          git rm -f .github/workflows/build-diagnostic.yml .github/workflows/repair-css.yml
          git commit -m "fix: reparar identificadores corrompidos no globals.css"
          git push
      - name: Relatorio em issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync("repair-report.txt") ? fs.readFileSync("repair-report.txt", "utf8") : "sem relatorio";
            const log = fs.existsSync("build-output.log") ? fs.readFileSync("build-output.log", "utf8") : "sem log";
            const tail = log.slice(-3000);
            const body = "RELATORIO DE REPARO\n\n~~~\n" + report + "\n~~~\n\nLOG DE BUILD (ultimos 3000):\n\n~~~\n" + tail + "\n~~~";
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: "Reparo do globals.css: relatorio", body });
            for (const n of [56, 57, 58, 59, 60]) {
              try { await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, state: "closed" }); } catch (e) { console.log("skip " + n); }
            }
