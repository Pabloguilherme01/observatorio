name: Sync official TSE results 2026

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 20-23 4 10 *'
    - cron: '*/5 0-2 5 10 *'
    - cron: '*/5 20-23 25 10 *'
    - cron: '*/5 0-2 26 10 *'

concurrency:
  group: official-results-2026
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync official JSON + JWS
        env:
          REQUIRE_RESULTS_SYNC: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          RESULTS_TURN: '1'
        run: npm run sync:results

      - name: Validate feed when captured
        shell: bash
        run: |
          if test -f public/data/tse-results.json; then
            REQUIRE_RESULTS_FEED=true npm run validate:results
          else
            echo "Feed ainda não publicado: aguardando arquivos oficiais do TSE."
          fi

      - name: Commit verified feed
        shell: bash
        run: |
          if ! test -f public/data/tse-results.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tse-results.json
          git diff --cached --quiet && exit 0
          git commit -m "data: sync official TSE results snapshot"
          git push
