name: Sync official TSE results 2026

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 0-2 5 10 *'
    - cron: '*/15 0-2 26 10 *'

concurrency:
  group: official-results-2026
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Resolve turn
        shell: bash
        run: |
          DAY=$(TZ=America/Sao_Paulo date +%d)
          if [ "$DAY" = "25" ] || [ "$DAY" = "26" ]; then
            echo "RESULTS_TURN=2" >> "$GITHUB_ENV"
          else
            echo "RESULTS_TURN=1" >> "$GITHUB_ENV"
          fi

      - name: Sync official JSON + JWS
        env:
          REQUIRE_RESULTS_SYNC: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run sync:results

      - name: Validate feed when captured
        shell: bash
        run: |
          if test -f public/data/tse-results.json; then
            REQUIRE_RESULTS_FEED=true npm run validate:results
          else
            echo "Feed ainda não publicado: aguardando arquivos oficiais do TSE."
          fi

      - name: Validate generated results branch with CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f public/data/tse-results.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tse-results.json public/data/tse-results-http-state.json
          git diff --cached --quiet && echo "No results snapshot change." && exit 0
          branch="automation/results-2026-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "data: sync official TSE results snapshot"
          git push --set-upstream origin "$branch"

          wait_for_ci() {
            local expected_sha="$1"
            CI_RUN_ID=""
            for attempt in {1..60}; do
              CI_RUN_ID="$(gh run list --workflow ci.yml --branch "$branch" --event push --limit 20 --json databaseId,headSha --jq '.[] | select(.headSha == "'"$expected_sha"'") | .databaseId' | head -n 1)"
              if [ -n "$CI_RUN_ID" ]; then break; fi
              sleep 2
            done
            test -n "$CI_RUN_ID"
            gh run watch "$CI_RUN_ID" --exit-status
          }

          branch_sha="$(git rev-parse HEAD)"
          wait_for_ci "$branch_sha"

          # A main pode avançar enquanto o snapshot é validado. Rebase o único
          # commit de dados sobre a main mais recente antes de abrir a PR e,
          # quando houver mudança de base, execute o CI novamente sobre o SHA final.
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
            git push --force-with-lease
            branch_sha="$(git rev-parse HEAD)"
            wait_for_ci "$branch_sha"
          fi

          existing_pr="$(gh pr list --state open --base main --head "$branch" --json number,url --jq '.[0].url // empty')"
          if [ -n "$existing_pr" ]; then
            echo "PR já existente: $existing_pr"
            pending_issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Resultados TSE 2026: PR pendente") | .number' | head -n 1)"
            if [ -n "$pending_issue" ]; then
              gh issue close "$pending_issue" --comment "PR já existente: $existing_pr"
            fi
          elif pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "data: sync official TSE results snapshot" \
            --body "Feed oficial TSE validado automaticamente. A branch foi validada pelo CI completo antes da abertura da PR." \
            2>/tmp/results-pr-error.log)"; then
            echo "PR criada: $pr_url"
            pending_issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Resultados TSE 2026: PR pendente") | .number' | head -n 1)"
            if [ -n "$pending_issue" ]; then
              gh issue close "$pending_issue" --comment "PR automática criada: $pr_url"
            fi
          else
            error_message="$(tr '\n' ' ' < /tmp/results-pr-error.log | head -c 500)"
            echo "::warning title=PR automática de resultados indisponível::$error_message"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            printf '%s\n' \
              "O feed oficial de resultados foi capturado e a branch passou pelo CI completo, mas o token do GitHub Actions não pôde criar a pull request." \
              "" \
              "- Branch validada: $branch" \
              "- CI: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$CI_RUN_ID" \
              "- Abrir PR manualmente: $compare_url" \
              "- Workflow de origem: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "" \
              "O workflow não faz merge direto na main. A publicação exige uma pull request revisada." \
              > /tmp/results-pending-pr.md
            pending_issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Resultados TSE 2026: PR pendente") | .number' | head -n 1)"
            if [ -n "$pending_issue" ]; then
              gh issue edit "$pending_issue" --body-file /tmp/results-pending-pr.md
            else
              gh issue create --title "Resultados TSE 2026: PR pendente" --body-file /tmp/results-pending-pr.md
            fi
          fi
