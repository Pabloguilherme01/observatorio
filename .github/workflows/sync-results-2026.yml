name: Sync official TSE results 2026

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 20-23 4 10 *'
    - cron: '*/5 0-2 5 10 *'
    - cron: '*/5 20-23 25 10 *'
    - cron: '*/5 0-2 26 10 *'

concurrency:
  group: official-results-2026
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability gate
        run: npm run audit:deps

      - name: Resolve turn
        shell: bash
        run: |
          DAY=$(TZ=America/Sao_Paulo date +%d)
          if [ "$DAY" = "25" ] || [ "$DAY" = "26" ]; then
            echo "RESULTS_TURN=2" >> "$GITHUB_ENV"
          else
            echo "RESULTS_TURN=1" >> "$GITHUB_ENV"
          fi

      - name: Sync official JSON + JWS
        env:
          REQUIRE_RESULTS_SYNC: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run sync:results

      - name: Validate feed when captured
        shell: bash
        run: |
          if test -f public/data/tse-results.json; then
            REQUIRE_RESULTS_FEED=true npm run validate:results
          else
            echo "Feed ainda não publicado: aguardando arquivos oficiais do TSE."
          fi

      - name: Open PR with verified feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f public/data/tse-results.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/tse-results.json public/data/tse-results-http-state.json
          git diff --cached --quiet && exit 0
          branch="automation/results-2026-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "data: sync official TSE results snapshot"
          git push --set-upstream origin "$branch"
          gh pr create             --base main             --head "$branch"             --title "data: sync official TSE results snapshot"             --body "Feed oficial TSE validado automaticamente. Este PR mantém a captura separada da publicação e passa pelo fluxo normal de revisão da main."
