name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Audit practical usability and links
        run: npm run audit:usability
      - name: Validate data contracts
        run: npm run validate:observatorio
      - name: Validate TSE architecture isolation
        run: npm run audit:tse-architecture
      - name: Validate versioned TSE snapshot contract
        env:
          REQUIRE_TSE_SYNC: 'true'
        run: npm run validate:tse
      - name: Validate production results feed contract
        run: npm run validate:results
      - name: Validate synthetic results contract fixture
        env:
          RESULTS_FEED_FILE: scripts/fixtures/tse-results.valid.synthetic.json
          REQUIRE_RESULTS_FEED: 'true'
        run: npm run validate:results
      - name: Snapshot diff fixture
        run: npm run test:snapshot-diff

      - name: Typecheck
        run: npm run typecheck
      - name: Verify JWS implementation
        run: npm run test:jws

      - name: Build
        run: npm run build
