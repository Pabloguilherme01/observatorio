name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Audit practical usability and links
        run: npm run audit:usability
      - name: Audit direct public service shortcuts
        env:
          AUDIT_PUBLIC_SERVICES_LIVE: 'true'
        run: npm run audit:public-services
      - name: Validate data contracts
        run: npm run validate:observatorio
      - name: Validate TSE architecture isolation
        run: npm run audit:tse-architecture
      - name: Static consistency audit
        run: npm run audit:static
      - name: Accessibility and contrast audit
        run: npm run audit:a11y
      - name: Runtime hardening audit
        run: npm run audit:runtime
      - name: Audit engagement and mobile regressions
        run: npm run audit:engagement
      - name: Audit quiz integrity
        run: npm run audit:quiz
      - name: Validate versioned TSE snapshot contract
        run: npm run validate:tse
      - name: Validate candidate source guard
        run: node scripts/test-candidate-source-guard.mjs
      - name: Validate production results feed contract
        run: npm run validate:results
      - name: Validate synthetic results contract fixture
        env:
          RESULTS_FEED_FILE: scripts/fixtures/tse-results.valid.synthetic.json
          REQUIRE_RESULTS_FEED: 'true'
        run: npm run validate:results
      - name: Mobile UX audit
        run: npm run audit:mobile
      - name: Typecheck
        run: npm run typecheck
      - name: Verify JWS implementation
        run: npm run test:jws
      - name: Build
        run: npm run build
