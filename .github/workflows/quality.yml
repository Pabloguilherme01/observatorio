name: Quality

on:
  workflow_run:
    workflows: ["Sync TSE candidates"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  quality:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main after TSE sync
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Validate data contracts
        run: npm run validate:observatorio
      - name: Validate TSE snapshot
        env:
          REQUIRE_TSE_SYNC: 'true'
        run: npm run validate:tse
      - name: Validate production results feed contract
        run: npm run validate:results
      - name: Validate synthetic results contract fixture
        env:
          RESULTS_FEED_FILE: scripts/fixtures/tse-results.valid.synthetic.json
          REQUIRE_RESULTS_FEED: 'true'
        run: npm run validate:results
      - name: Typecheck
        run: npm run typecheck
      - name: Verify JWS implementation
        run: npm run test:jws

      - name: Build
        run: npm run build
