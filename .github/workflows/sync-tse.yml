name: Sync TSE municipal snapshot

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync official TSE municipal snapshot
        run: npm run sync:tse

      - name: Validate synchronized snapshot
        env:
          REQUIRE_TSE_SYNC: 'true'
        run: npm run validate:tse

      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- src/data/generated; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated
          git commit -m "chore: update TSE municipal snapshot"
          git push
