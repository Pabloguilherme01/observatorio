name: Sync TSE 2026

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3,9,15,21 * * *'

permissions:
  contents: write

jobs:
  sync-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync candidate snapshot
        run: node scripts/sync-tse-2026.mjs

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/tse2026-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "data: sync TSE 2026 candidate snapshot"
          git push
