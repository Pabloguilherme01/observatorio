name: Sync TSE 2026

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: tse-sync-2026
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability gate
        run: npm run audit:deps

      - name: Capture official TSE candidate snapshot
        env:
          # Execuções agendadas preservam o último snapshot válido quando a origem oficial
          # está temporariamente bloqueada/indisponível. Execução manual permanece estrita.
          REQUIRE_TSE_FRESH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run sync:tse

      - name: Mark successful TSE freshness check
        if: env.TSE_UPSTREAM_STATUS == 'ok'
        shell: bash
        run: echo "TSE_FRESHNESS_CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Validate TSE candidate snapshot
        env:
          REQUIRE_TSE_SYNC: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          REQUIRE_TSE_FRESH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          TSE_MAX_AGE_HOURS: '24'
          ALLOW_UPSTREAM_UNAVAILABLE: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
        run: npm run validate:tse

      - name: Validate observatory data contracts
        run: npm run validate:observatorio

      - name: Audit static consistency
        run: npm run audit:static

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Validate generated snapshot branch with CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/tse2026-candidates.json src/data/generated/tse2026-diff.json src/data/generated/history
          git diff --cached --quiet && echo "No candidate snapshot change." && exit 0
          branch="automation/tse-2026-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "data: sync TSE 2026 candidates"
          git push --set-upstream origin "$branch"

          gh workflow run ci.yml --ref "$branch"
          run_id=""
          for attempt in {1..30}; do
            run_id="$(gh run list --workflow ci.yml --branch "$branch" --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status

          existing_pr="$(gh pr list --state open --base main --head "$branch" --json number,url --jq '.[0].url // empty')"
          if [ -n "$existing_pr" ]; then
            echo "PR já existente: $existing_pr"
            pending_issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Automação TSE 2026: PR pendente") | .number' | head -n 1)"
            if [ -n "$pending_issue" ]; then
              gh issue close "$pending_issue" --comment "PR já existente: $existing_pr"
            fi
          elif pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "data: sync TSE 2026 candidates" \
            --body "Snapshot TSE validado automaticamente. A branch foi validada pelo CI completo antes da abertura da PR." \
            2>/tmp/tse-pr-error.log)"; then
            echo "PR criada: $pr_url"
            pending_issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Automação TSE 2026: PR pendente") | .number' | head -n 1)"
            if [ -n "$pending_issue" ]; then
              gh issue close "$pending_issue" --comment "PR automática criada: $pr_url"
            fi
          else
            error_message="$(tr '\n' ' ' < /tmp/tse-pr-error.log | head -c 500)"
            echo "::warning title=PR automática TSE indisponível::$error_message"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            printf '%s\n' \
              "A captura TSE foi concluída e a branch passou pelo CI completo, mas o token do GitHub Actions não pôde criar a pull request." \
              "" \
              "- Branch validada: `$branch`" \
              "- CI: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$run_id" \
              "- Abrir PR manualmente: $compare_url" \
              "- Workflow de origem: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "" \
              "A branch não é publicada diretamente na `main`; revisão e merge continuam obrigatórios." \
              > /tmp/tse-pending-pr.md
            pending_issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Automação TSE 2026: PR pendente") | .number' | head -n 1)"
            if [ -n "$pending_issue" ]; then
              gh issue edit "$pending_issue" --body-file /tmp/tse-pending-pr.md
            else
              gh issue create --title "Automação TSE 2026: PR pendente" --body-file /tmp/tse-pending-pr.md
            fi
          fi
