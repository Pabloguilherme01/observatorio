name: Sync TSE 2026

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-tse-2026.mjs'
      - 'scripts/validate-tse-2026.mjs'
      - 'src/data/generated/tse2026-candidates.json'
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: tse-sync-2026
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture official TSE candidate snapshot
        env:
          # Verificação agendada não deve ficar vermelha por bloqueio transitório da origem.
          # Execução manual continua estrita e falha quando a fonte oficial não pode ser capturada.
          REQUIRE_TSE_FRESH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run sync:tse

      - name: Mark successful TSE freshness check
        if: env.TSE_UPSTREAM_STATUS == 'ok'
        shell: bash
        run: echo "TSE_FRESHNESS_CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Validate TSE candidate snapshot
        env:
          REQUIRE_TSE_SYNC: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          REQUIRE_TSE_FRESH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          TSE_MAX_AGE_HOURS: '24'
          ALLOW_UPSTREAM_UNAVAILABLE: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
        run: npm run validate:tse

      - name: Validate observatory data contracts
        run: npm run validate:observatorio

      - name: Audit static consistency
        run: npm run audit:static

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit validated TSE candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/tse2026-candidates.json src/data/generated/tse2026-diff.json src/data/generated/history
          git diff --cached --quiet && echo "No candidate snapshot change." && exit 0
          git commit -m "data: sync TSE 2026 candidates"
          git push
