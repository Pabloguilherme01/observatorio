name: TSE first capture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'generated/**'
      - 'public/api/v1/**'
      - 'src/data/generated/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tse-first-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Executar primeiro batch oficial TSE
        run: |
          set -euo pipefail
          npm run ingest:tse:first-batch
          npm run verify:tse:capture
      - name: Commit first capture
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated public/api/v1 src/data/generated
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração de snapshot.'
            exit 0
          fi
          git commit -m 'data(tse): atualizar first capture oficial'
          git push origin 'HEAD:${{ github.event.pull_request.head.ref }}'
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tse-first-capture-evidence
          path: |
            generated
            public/api/v1
            src/data/generated
