name: TSE recapture · branch fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    branches:
      - feat/v44-trust-pwa-accessibility
    paths:
      - 'scripts/tse/**'
      - 'src/schemas/tse-enriched.schema.ts'
      - 'src/data/generated/tse2026-candidates.json'

permissions:
  contents: write

jobs:
  recapture:
    runs-on: ubuntu-latest
    concurrency:
      group: tse-recapture-v44
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v44-trust-pwa-accessibility
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Recapturar e promover snapshots TSE
        run: |
          set -euo pipefail
          npm run ingest:tse:first-batch
          npm run typecheck

      - name: Verificar integridade dos snapshots
        run: |
          set -euo pipefail
          npm run verify:tse:capture
          test -f public/api/v1/contas.json
          test -f public/api/v1/pesquisas.json
          test -f public/api/v1/processual.json
          if grep -R -n "�" generated/tse2026-processual.json src/data/generated/processual-snapshot.json public/api/v1/processual.json; then
            echo "::error::Encoding corrompido encontrado no processual."
            exit 1
          fi
          node --experimental-strip-types -e "for (const p of ['generated/tse2026-contas.json','generated/tse2026-pesquisas.json']) { const x=require('node:fs').readFileSync(p,'utf8'); const j=JSON.parse(x); if(!((j.totalCandidatosComContas ?? j.totalPesquisas) > 0)) throw new Error(p+' continua sem registros associados'); }"

      - name: Publicar evidência da recaptura
        uses: actions/upload-artifact@v4
        with:
          name: tse-recapture-v44
          path: |
            generated/tse2026-contas.json
            generated/tse2026-pesquisas.json
            generated/tse2026-processual.json
            public/api/v1/contas.json
            public/api/v1/pesquisas.json
            public/api/v1/processual.json
            src/data/generated/contas-snapshot.json
            src/data/generated/pesquisas-snapshot.json
            src/data/generated/processual-snapshot.json
            src/data/generated/snapshot-diff.json

      - name: Registrar estado da recaptura
        run: echo 'Recaptura validada neste commit; este job não altera o branch.'
