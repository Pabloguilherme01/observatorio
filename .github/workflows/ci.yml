name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test first and second turn results contracts
        run: npm run test:results

      - name: Install cross-browser engines
        run: npm exec -- playwright install --with-deps chromium firefox webkit

      - name: Audit source integrity
        run: npm run audit:sources

      - name: Cross-browser audit
        run: npm run audit:browser

      - name: Test unavailable TSE source handling
        run: npm run test:tse-unavailable

      - name: Build
        run: npm run build

      - name: Verify production PWA artifact
        run: npm run test:pwa
