name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability gate
        run: npm run audit:deps

      - name: Validate production results feed contract
        run: npm run validate:results

      - name: Validate synthetic results contract fixture
        env:
          RESULTS_FEED_FILE: scripts/fixtures/tse-results.valid.synthetic.json
          REQUIRE_RESULTS_FEED: 'true'
        run: npm run validate:results

      - name: Complete audit gate
        run: npm run audit:all

      - name: Validate TSE snapshot
        run: npm run validate:tse

      - name: Validate candidate source guard
        run: node scripts/test-candidate-source-guard.mjs

      - name: Verify JWS implementation
        run: npm run test:jws

      - name: Build
        run: npm run build

