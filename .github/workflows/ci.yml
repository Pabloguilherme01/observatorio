name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate production results feed contract
        run: npm run validate:results

      - name: Validate synthetic results contract fixture
        env:
          RESULTS_FEED_FILE: scripts/fixtures/tse-results.valid.synthetic.json
          REQUIRE_RESULTS_FEED: 'true'
        run: npm run validate:results

      - name: Typecheck
        run: npm run typecheck

      - name: Static consistency audit
        run: npm run audit:static

      - name: Accessibility and contrast audit
        run: npm run audit:a11y

      - name: Mobile UX audit
        run: npm run audit:mobile

      - name: Runtime hardening audit
        run: npm run audit:runtime

      - name: Usability audit
        run: npm run audit:usability

      - name: Sources audit
        run: npm run audit:sources

      - name: Engagement audit
        run: npm run audit:engagement

      - name: Quiz audit
        run: npm run audit:quiz

      - name: Verify TSE architecture
        run: npm run audit:tse-architecture

      - name: Validate TSE snapshot
        run: npm run validate:tse

      - name: Validate candidate source guard
        run: node scripts/test-candidate-source-guard.mjs

      - name: Verify JWS implementation
        run: npm run test:jws

      - name: Build
        run: npm run build

      - name: Install browser test dependencies
        run: npm run test:browser:prepare

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:browser

      - name: Browser accessibility smoke test
        run: npm run test:a11y:browser
