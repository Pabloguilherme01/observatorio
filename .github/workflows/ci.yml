name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'automation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CI · quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Core quality contract
        run: npm run quality:check

      - name: Audit workflow structure
        run: npm run audit:workflows

      - name: Test branch cleanup safety
        run: npm run test:branch-cleanup

      - name: Audit style source budget
        run: npm run audit:styles

      - name: Guard main provenance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:main-provenance

      - name: Audit practical usability
        run: npm run audit:usability

      - name: Audit public-service catalog contract
        run: npm run audit:public-services

      - name: Validate observatory data contracts
        run: npm run validate:observatorio

      - name: Runtime hardening audit
        run: npm run audit:runtime

      - name: Audit engagement contracts
        run: npm run audit:engagement

      - name: Audit quiz integrity
        run: npm run audit:quiz

      - name: Validate TSE architecture isolation
        run: npm run audit:tse-architecture

      - name: Test TSE diff regression contract
        run: npm run test:tse-diff

      - name: Test first and second turn results contracts
        run: npm run test:results

      - name: Test post-election transition contract
        run: npm run test:post-election

      - name: Test source audit availability policy
        run: npm run test:source-audit-policy

      - name: Audit source integrity
        run: npm run audit:sources

      - name: Audit source provenance
        run: npm run audit:provenance

      - name: Audit TSE candidate snapshot provenance
        run: npm run audit:candidate-snapshot

      - name: Test unavailable TSE source handling
        run: npm run test:tse-unavailable

      - name: Validate TSE candidate snapshot contract
        run: npm run validate:tse

      - name: Validate candidate source guard
        run: npm run test:candidate-source-guard

      - name: Dependency vulnerability gate
        run: npm run audit:deps

      - name: Validate production results feed contract
        run: npm run validate:results

      - name: Validate synthetic results contract fixture
        env:
          RESULTS_FEED_FILE: scripts/fixtures/tse-results.valid.synthetic.json
          REQUIRE_RESULTS_FEED: 'true'
        run: npm run validate:results

      - name: Verify JWS implementation
        run: npm run test:jws

      - name: Release readiness contract
        run: npm run audit:release
