name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability gate
        run: npm run audit:deps

      - name: Validate production results feed contract
        run: npm run validate:results

      - name: Validate synthetic results contract fixture
        env:
          RESULTS_FEED_FILE: scripts/fixtures/tse-results.valid.synthetic.json
          REQUIRE_RESULTS_FEED: 'true'
        run: npm run validate:results

      - name: Test first and second turn results contracts
        run: npm run test:results

      - name: Install cross-browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Complete audit gate
        run: npm run audit:all

      - name: Validate TSE snapshot
        run: npm run validate:tse

      - name: Test unavailable TSE source handling
        run: npm run test:tse-unavailable

      - name: Validate candidate source guard
        run: node scripts/test-candidate-source-guard.mjs

      - name: Verify JWS implementation
        run: npm run test:jws

      - name: Build
        run: npm run build

      - name: Verify production PWA artifact
        run: npm run test:pwa

