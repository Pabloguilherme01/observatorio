name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate production results feed contract
        run: npm run validate:results
      - name: Validate synthetic results contract fixture
        env:
          RESULTS_FEED_FILE: scripts/fixtures/tse-results.valid.synthetic.json
          REQUIRE_RESULTS_FEED: 'true'
        run: npm run validate:results

      - name: Typecheck
        run: npm run typecheck

      - name: Verify JWS implementation
        run: npm run test:jws

      - name: Build
        run: npm run build
