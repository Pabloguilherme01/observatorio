name: Reparo de CSS v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reparar e validar
        run: |
          node <<'EOF'
          const fs = require("fs");
          const p = "src/assets/styles/globals.css";
          let s = fs.readFileSync(p, "utf8");
          const fixes = [
            [/--surface-st\s+rong/g, "--surface-strong"],
            [/ov\s+erflow\b/g, "overflow"],
            [/--obs-fon\s+t-sans/g, "--obs-font-sans"],
            [/\bmin-widt\s+h\b/g, "min-width"],
            [/\bdis\s+play\b/g, "display"],
          ];
          const counts = [];
          for (const [re, b] of fixes) { const m = s.match(re); counts.push(`${re} -> ${b} (${m ? m.length : 0}x)`); s = s.replace(re, b); }
          let selN = 0;
          s = s.replace(/#\s+([a-zA-Z0-9_-])/g, (m, c) => { selN++; return "#" + c; });
          counts.push(`#ws -> # (${selN}x)`);
          fs.writeFileSync(p, s);
          const lines = s.split("\n");
          const sus = lines.map((l, i) => [i + 1, l]).filter(([i, l]) => /[a-z]\n[a-z]/.test(l) === false && /[a-z] [a-z]{1,4}:/.test(l)).map(([i,l])=>i+": "+l.trim());
          fs.writeFileSync("repair-report.txt", counts.join("\n") + "\n\nRESTANTES SUSPEITOS:\n" + sus.join("\n"));
          console.log(fs.readFileSync("repair-report.txt", "utf8"));
          EOF
          npm install --no-audit --no-fund > /dev/null 2>&1
          set +e
          npm run build > build-output.log 2>&1
          echo "exit_code=$?" >> build-output.log
      - name: Commit do reparo e limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/styles/globals.css
          git rm -f .github/workflows/repair-css-v2.yml
          git commit -m "fix: reparar quebras de linha dentro de identificadores do globals.css"
          git push
      - name: Relatorio em issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync("repair-report.txt") ? fs.readFileSync("repair-report.txt", "utf8") : "sem relatorio";
            const log = fs.existsSync("build-output.log") ? fs.readFileSync("build-output.log", "utf8") : "sem log";
            const warns = (log.match(/Issue #\d+/g) || []).length;
            const body = "RELATORIO DE REPARO V2\n\n~~~\n" + report + "\n~~~\n\nWarnings CSS restantes no build: " + warns + "\n\nLOG (ultimos 1500):\n\n~~~\n" + log.slice(-1500) + "\n~~~";
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: "Reparo do globals.css v2: relatorio", body });
            for (const n of [61]) { try { await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: n, state: "closed" }); } catch (e) {} }
