<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Observatório Águas Lindas 2026</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#f8fafc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#16304d,#07111f 55%)}
    main{width:min(620px,100%);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:32px;background:rgba(15,23,42,.92);box-shadow:0 30px 90px rgba(0,0,0,.4);text-align:center}
    .icon{width:84px;height:84px;margin:0 auto 20px;border-radius:24px;background:#0b1117;display:grid;place-items:center;border:1px solid rgba(125,211,252,.25)}
    .icon span{font-size:34px;font-weight:900;color:#7dd3fc}
    .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#7dd3fc;font-weight:800}
    h1{font-size:clamp(2rem,7vw,3rem);line-height:1.05;margin:12px 0}
    p{color:#cbd5e1;line-height:1.65}
    a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;margin-top:16px;padding:0 22px;border-radius:14px;background:#7dd3fc;color:#082032;font-weight:900;text-decoration:none}
    .note{margin-top:20px;padding:16px;border:1px solid rgba(125,211,252,.18);border-radius:18px;color:#94a3b8;font-size:14px;text-align:left}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true"><span>O</span></div>
    <div class="eyebrow">Observatório Águas Lindas 2026</div>
    <h1>Você está offline</h1>
    <p>A conexão com a internet foi interrompida. Algumas funções podem continuar disponíveis usando os dados já carregados no dispositivo.</p>
    <a href="/observatorio/">Tentar novamente</a>
    <div class="note">Quando a conexão voltar, atualize o aplicativo para receber novos dados, melhorias e correções.</div>
  </main>
</body>
</html>
