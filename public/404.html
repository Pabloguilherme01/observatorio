<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Redirecionando · Observatório Águas Lindas 2026</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#030712;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(560px,100%);padding:32px 24px;border:1px solid #1a2638;border-radius:24px;background:#0b1320;box-shadow:0 20px 70px rgba(0,0,0,.35);text-align:center}
.code{font-size:clamp(4rem,18vw,6.5rem);line-height:.9;font-weight:950;color:#38bdf8;letter-spacing:-.06em}
h1{margin:16px 0 8px;font-size:1.45rem}p{margin:0 auto;max-width:460px;color:#94a3b8;line-height:1.6;font-size:.95rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:800}
.primary{background:#38bdf8;color:#03101a}.secondary{border:1px solid #26374a;color:#cbd5e1}
.note{margin-top:18px;padding-top:16px;border-top:1px solid #1a2638;color:#64748b;font-size:.78rem}
@media(max-width:520px){.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
<div class="code" aria-hidden="true">SPA</div>
<h1 id="title">Restaurando a rota</h1>
<p>O GitHub Pages serve o observatório como aplicação de página única. Esta camada preserva o endereço solicitado e devolve a rota ao aplicativo.</p>
<div class="actions">
<a class="btn primary" href="./">Abrir painel</a>
<a class="btn secondary" href="./#fontes">Conferir fontes</a>
</div>
<p class="note">Fallback SPA ativo · a rota original será restaurada no cliente.</p>
</main>
<script>
(function(){
  var BASE='/observatorio/';
  var path=location.pathname;
  var relative=path.indexOf(BASE)===0 ? path.slice(BASE.length) : path.replace(/^\/+/, '');
  var payload='/' + relative + location.search + location.hash;
  var target=BASE + '?/' + encodeURIComponent(payload);
  document.documentElement.dataset.obsSpaFallback='true';
  if(payload==='/' || payload==='/') {
    location.replace(BASE);
    return;
  }
  if(relative.indexOf('api/')===0 || /\.[A-Za-z0-9]{2,8}$/.test(relative)) {
    return;
  }
  location.replace(target);
})();
</script>
</body>
</html>
