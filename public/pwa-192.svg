<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Observatório Águas Lindas</title>
  <desc id="desc">Um círculo de observação azul com três colunas ascendentes</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102C44"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="orbit" x1="125" y1="125" x2="385" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DEAF4"/>
      <stop offset="1" stop-color="#36AEE2"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#background)"/>
  <circle cx="256" cy="256" r="146" fill="#0D2437" stroke="url(#orbit)" stroke-width="19"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#79BDD6" stroke-opacity=".18" stroke-width="2"/>
  <rect x="183" y="266" width="35" height="70" rx="10" fill="#E9F8FC"/>
  <rect x="239" y="227" width="35" height="109" rx="10" fill="#E9F8FC"/>
  <rect x="295" y="186" width="35" height="150" rx="10" fill="#66D6ED"/>
